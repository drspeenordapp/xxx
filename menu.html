<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Dr Speed</title>
<style>
/* Réinitialisation de base */
* {margin: 0;padding: 0;box-sizing: border-box;font-family: Arial, sans-serif;
}
body {display: flex;flex-direction: column;min-height: 100vh;background-color: #121212;color: #e0e0e0;align-items: center;text-align: center;padding: 0 20px;
}
/* Barre de navigation */
.navbar {width: 100%;max-width: 800px;background: rgba(255, 255, 255, 0.1);box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);border: 1px solid rgba(255, 255, 255, 0.2);padding: 15px;text-align: center;font-size: 1.5em;font-weight: bold;color: #f5a623;border-radius: 15px;margin-top: 30px;margin-bottom: 20px;
}
.navbar:hover {background-color: #f5a623;color: #121212;
}
/* Image de profil */
.profile-image {width: 200px;height: 200px;background: url('IMG/LOGO-removebg-preview.png') no-repeat center center;background-size: cover;border-radius: 50%;margin: 20px auto;box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}
main {max-width: 800px;width: 100%;padding: 20px;
}
/* Catégories de produits */
.product-category {background-color: #1c1c1c;border-radius: 12px;border: 1px solid #333;box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);margin-bottom: 30px;overflow: hidden;cursor: pointer;transition: all 0.3s ease;
}
.product-category:hover {background-color: #f5a623;color: #121212;
}
.product-category h2 {padding: 15px 20px;font-size: 1.8rem;color: #f5a623;background-color: #1f1f1f;margin: 0;
}
/* Contenu de la catégorie */
.category-content {display: none;padding: 20px;background-color: #121212;cursor: default;
}
/* Produits individuels */
.product-variety {background-color: #1f1f1f;padding: 15px;border-radius: 10px;border: 1px solid #333;margin-bottom: 20px;transition: all 0.3s ease;
}
.product-variety h3 {font-size: 1.5rem;color: #f5a623;margin-bottom: 10px;
}
.description {font-size: 1rem;color: #b3b3b3;line-height: 1.6;
}
.price-list {font-size: 1rem;color: #f5a623;margin-top: 10px;text-align: center;
}
/* Bouton de commande */
.buy-button {display: inline-block;background-color: #f5a623;color: #121212;padding: 10px 20px;margin-top: 15px;border-radius: 5px;text-decoration: none;font-weight: bold;transition: all 0.3s ease;
}
.buy-button:hover {background-color: #ffba4b;
}
/* Vidéo et sous-variétés */
.sub-variety {margin-top: 20px;text-align: center;
}
.sub-variety h4 {font-size: 1.2rem;color: #e0e0e0;margin-bottom: 10px;
}
.media {width: 100%;max-width: 100%;border-radius: 8px;margin-bottom: 20px;
}
.media.video {width: 100%;height: auto;aspect-ratio: 16 / 9;
}
footer {background-color: #1f1f1f;color: #e0e0e0;width: 100%;padding: 10px;text-align: center;font-size: 0.9rem;border-top: 1px solid #333;margin-top: auto;
}
h1 { font-size: 20px; }
h2 { font-size: 20px; }
</style>
</head>
<body>

<!-- Barre de navigation -->
<div class="navbar">Menu DR SPEED</div>

<!-- Image de profil -->
<div class="profile-image"></div>

<main>

  <h4> ❌ SOLD OUT TOTAL ❌ </h4>
  <h4> ⚙️ En cours de rechargement ⚙️ </h4>


</main>

<footer>
<p>&copy; 2026 DRSPEED - Tous droits réservés</p>
</footer>

<script>
// Fonction pour basculer la visibilité du contenu de la catégorie
function toggleCategoryContent(element, event) {
  // Empêche le comportement si on clique directement sur une vidéo ou un bouton à l'intérieur
  if (event.target.tagName === 'VIDEO' || event.target.tagName === 'SOURCE' || event.target.closest('a')) {
    return;
  }
  const categoryContent = element.querySelector('.category-content');
  categoryContent.style.display = categoryContent.style.display === 'block' ? 'none' : 'block';
  element.classList.toggle('active');
}
</script>

</body>
</html>
